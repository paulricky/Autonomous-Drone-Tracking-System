[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ece3162-drone-motion-planning"
version = "0.1.0"
description = "Hand-guided autonomous F450 motion-planning research platform"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.16.2",
    "PyYAML==6.0.3",
    "matplotlib==3.10.6",
    "pytest==8.4.2",
    "mujoco==3.3.7",
    "opencv-contrib-python==4.11.0.86",
    "mediapipe==0.10.21; platform_machine != 'aarch64'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "common*",
    "hand_tracking*",
    "mapping*",
    "planning*",
    "simulation*",
    "trajectory*",
    "utils*",
    "visualization*",
]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
