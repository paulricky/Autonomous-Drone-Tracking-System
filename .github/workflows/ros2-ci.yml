name: ROS 2 Jazzy CI
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep python3-pip python3-pytest python3-venv libopencv-dev clang-format-18
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y --rosdistro jazzy
          python3 -m venv --system-site-packages /tmp/robotics-venv
          /tmp/robotics-venv/bin/python -m pip install -e '.[dev]'
      - name: Python regression tests
        run: /tmp/robotics-venv/bin/python -m pytest -q
      - name: Build
        shell: bash
        run: source /opt/ros/jazzy/setup.bash && export PATH=/tmp/robotics-venv/bin:$PATH && colcon list --base-paths src && colcon build --base-paths src --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release
      - name: Native C++ formatting
        run: find src/robotics_core src/stereo_perception -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -exec clang-format-18 --dry-run --Werror -style=file {} +
      - name: Native perception navigation smoke
        shell: bash
        run: source /opt/ros/jazzy/setup.bash && source install/setup.bash && /tmp/robotics-venv/bin/python scripts/validate_phase4_ros.py --scenarios static disconnect
      - name: ROS tests
        shell: bash
        run: source /opt/ros/jazzy/setup.bash && source install/setup.bash && export PATH=/tmp/robotics-venv/bin:$PATH && colcon test --base-paths src --event-handlers console_direct+ && colcon test-result --verbose
      - name: Headless simulation smoke test
        env: {MPLBACKEND: Agg}
        run: /tmp/robotics-venv/bin/python scripts/run_duckiedrone_sim.py --scenario baseline
  arm64-source-build:
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable Python core
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv /tmp/robotics-arm-venv
          /tmp/robotics-arm-venv/bin/python -m pip install -e '.[dev]'
          /tmp/robotics-arm-venv/bin/python -m pytest -q
